        let currentLocation = 'krabi';

        function renderApp() {
            const container = document.getElementById('app-container');
            const data = itineraryData[currentLocation];
            const themeBtnColor = data.themeColor === 'teal' ? 'bg-teal-600' : 'bg-blue-600';
            
            // Update Toggle Buttons
            document.getElementById('btn-krabi').className = `flex-1 sm:w-32 py-2 px-4 rounded-lg font-medium text-sm transition-all duration-200 ${currentLocation === 'krabi' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`;
            document.getElementById('btn-phuket').className = `flex-1 sm:w-32 py-2 px-4 rounded-lg font-medium text-sm transition-all duration-200 ${currentLocation === 'phuket' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`;

            // Build HTML
            let html = `
                <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-100 mb-8">
                    <div class="flex items-center gap-3 mb-4">
                        <h2 class="text-3xl font-bold text-slate-800">${data.title} Overview</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-slate-600 text-base leading-relaxed">
                        <div class="space-y-4">
                            <p class="flex items-start gap-3">
                                <span class="text-xl">📅</span>
                                <span><strong class="text-slate-800 block">Dates</strong> ${data.dates}</span>
                            </p>
                            <p class="flex items-start gap-3">
                                <span class="text-xl">🏨</span>
                                <span><strong class="text-slate-800 block">Accommodation</strong> ${data.hotel}</span>
                            </p>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <p class="flex items-start gap-3">
                                <span class="text-xl">⭐</span>
                                <span><strong class="text-slate-800 block mb-1">Top Priorities</strong> ${data.priorities}</span>
                            </p>
                        </div>
                    </div>
                </section>
                
                <h3 class="text-2xl font-bold text-slate-800 mb-6 pl-3 border-l-4 ${data.themeColor === 'teal' ? 'border-teal-500' : 'border-blue-500'}">Activities & Excursions</h3>
                <div class="space-y-5">
            `;

            data.categories.forEach((cat, index) => {
                let catId = `cat-${index}`;
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="toggleCategory('${catId}')" class="w-full px-6 py-5 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors focus:outline-none text-left">
                            <h4 class="text-xl font-semibold text-slate-800 flex items-center gap-3">
                                ${cat.icon} ${cat.name}
                            </h4>
                            <svg class="w-6 h-6 text-slate-400 icon-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <div id="${catId}" class="accordion-content ${index === 0 ? 'is-open' : ''}">
                            <div class="accordion-inner bg-slate-50 border-t border-slate-100">
                                <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                `;

                cat.activities.forEach((act) => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
                            <div class="h-56 overflow-hidden relative border-b border-slate-100">
                                <img src="${act.image}" alt="${act.title}" class="w-full h-full object-cover transition-transform duration-700 hover:scale-105" loading="lazy" onerror="this.src='https://placehold.co/800x600/e2e8f0/64748b?text=Image+Unavailable'">
                            </div>
                            <div class="p-6 flex-1 flex flex-col text-slate-700">
                                <h5 class="text-xl font-bold text-slate-800 mb-3">${act.title}</h5>
                                
                                <div class="space-y-4 text-sm leading-relaxed">
                                    <p><strong class="text-slate-900 block mb-1">Description:</strong> ${act.description}</p>
                                    
                                    <div class="grid grid-cols-1 gap-3 bg-slate-50 p-4 rounded-lg border border-slate-100">
                                        <p><strong>Time:</strong> ${act.time}</p>
                                        <p><strong>Getting there / Transport:</strong> ${act.transport}</p>
                                        <p><strong>Weather sensitivity:</strong> ${act.weather}</p>
                                        <p><strong>Combine with:</strong> ${act.combine}</p>
                                    </div>

                                    <div class="bg-amber-50 p-4 rounded-lg border border-amber-100 text-amber-900">
                                        <strong>Booking lead time:</strong> ${act.booking}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function switchLocation(location) {
            if(currentLocation === location) return;
            currentLocation = location;
            
            const container = document.getElementById('app-container');
            container.style.opacity = '0.4';
            
            setTimeout(() => {
                renderApp();
                container.style.opacity = '1';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }

        function toggleCategory(id) {
            const element = document.getElementById(id);
            if (element.classList.contains('is-open')) {
                element.classList.remove('is-open');
            } else {
                element.classList.add('is-open');
            }
        }

        window.onload = () => {
            renderApp();
        };
    </script>
