        /* Smooth Accordion Animation */
        .accordion-content {

            text-decoration: underline;
            text-underline-offset: 2px;
        }

        let currentLocation = 'itinerary';

        function renderApp() {
            const container = document.getElementById('app-container');
            const data = itineraryData[currentLocation];
            
            // Determine active button color
            let activeClass = 'bg-indigo-600 text-white shadow-sm';
            if(data.themeColor === 'teal') activeClass = 'bg-teal-600 text-white shadow-sm';
            if(data.themeColor === 'blue') activeClass = 'bg-blue-600 text-white shadow-sm';

            // Reset buttons
            const defaultBtnClass = 'flex-1 sm:flex-none py-2 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 hover:bg-slate-200';
            document.getElementById('btn-itinerary').className = `sm:w-36 ${defaultBtnClass}`;
            document.getElementById('btn-krabi').className = `sm:w-28 ${defaultBtnClass}`;
            document.getElementById('btn-phuket').className = `sm:w-28 ${defaultBtnClass}`;

            // Set active button
            if(currentLocation === 'itinerary') document.getElementById('btn-itinerary').className = `flex-1 sm:flex-none sm:w-36 py-2 px-4 rounded-lg font-medium text-sm transition-all duration-200 ${activeClass}`;
            if(currentLocation === 'krabi') document.getElementById('btn-krabi').className = `flex-1 sm:flex-none sm:w-28 py-2 px-4 rounded-lg font-medium text-sm transition-all duration-200 ${activeClass}`;
            if(currentLocation === 'phuket') document.getElementById('btn-phuket').className = `flex-1 sm:flex-none sm:w-28 py-2 px-4 rounded-lg font-medium text-sm transition-all duration-200 ${activeClass}`;

            // Accent color for border
            let accentBorderClass = 'border-indigo-500';
            if(data.themeColor === 'teal') accentBorderClass = 'border-teal-500';
            if(data.themeColor === 'blue') accentBorderClass = 'border-blue-500';

            // Build HTML
            let html = `
                <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-100 mb-8">
                    <div class="flex items-center gap-3 mb-4">
                        <h2 class="text-3xl font-bold text-slate-800">${data.title}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-slate-600 text-base leading-relaxed">
                        <div class="space-y-4">
                            <p class="flex items-start gap-3">
                                <span class="text-xl">📅</span>
                                <span><strong class="text-slate-800 block">Dates</strong> ${data.dates}</span>
                            </p>
                            <p class="flex items-start gap-3">
                                <span class="text-xl">🏨</span>
                                <span><strong class="text-slate-800 block">Accommodation</strong> ${data.hotel}</span>
                            </p>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <p class="flex items-start gap-3">
                                <span class="text-xl">⭐</span>
                                <span><strong class="text-slate-800 block mb-1">Top Priorities</strong> ${data.priorities}</span>
                            </p>
                        </div>
                    </div>
                </section>
                
                <h3 class="text-2xl font-bold text-slate-800 mb-6 pl-3 border-l-4 ${accentBorderClass}">${currentLocation === 'itinerary' ? 'Day-by-Day Guide' : 'Activities & Excursions'}</h3>
                <div class="space-y-5">
            `;

            data.categories.forEach((cat, index) => {
                let catId = `cat-${index}`;
                // Keep the first tab open by default
                let isOpen = index === 0 ? 'is-open' : '';
                
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="toggleCategory('${catId}')" class="w-full px-6 py-5 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors focus:outline-none text-left">
                            <h4 class="text-xl font-semibold text-slate-800 flex items-center gap-3">
                                ${cat.icon} ${cat.name}
                            </h4>
                            <svg class="w-6 h-6 text-slate-400 icon-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <div id="${catId}" class="accordion-content ${isOpen}">
                            <div class="accordion-inner bg-slate-50 border-t border-slate-100">
                                <div class="p-4 sm:p-6 grid grid-cols-1 ${currentLocation === 'itinerary' ? 'lg:grid-cols-2' : 'md:grid-cols-2'} gap-6">
                `;

                cat.activities.forEach((act) => {
                    // Conditionally render image if it exists
                    let imageHtml = act.image ? `
                        <div class="${currentLocation === 'itinerary' ? 'h-48 sm:h-64' : 'h-56'} overflow-hidden relative border-b border-slate-100 shrink-0">
                            <img src="${act.image}" alt="${act.title}" class="w-full h-full object-cover transition-transform duration-700 hover:scale-105" loading="lazy">
                        </div>
                    ` : '';

                    // Conditionally render structured details (Time, Transport, Weather, Combine) if any exist
                    let detailsHtml = '';
                    if (act.time || act.transport || act.weather || act.combine) {
                        detailsHtml += `<div class="grid grid-cols-1 gap-3 bg-slate-50 p-4 rounded-lg border border-slate-100 mt-4 text-sm">`;
                        if (act.time) detailsHtml += `<p><strong>Time:</strong> ${act.time}</p>`;
                        if (act.transport) detailsHtml += `<p><strong>Getting there / Transport:</strong> ${act.transport}</p>`;
                        if (act.weather) detailsHtml += `<p><strong>Weather sensitivity:</strong> ${act.weather}</p>`;
                        if (act.combine) detailsHtml += `<p><strong>Combine with:</strong> ${act.combine}</p>`;
                        detailsHtml += `</div>`;
                    }

                    // Conditionally render structured Booking section if it exists
                    let bookingHtml = act.booking ? `
                        <div class="bg-amber-50 p-4 rounded-lg border border-amber-100 text-amber-900 mt-4 text-sm">
                            <strong>Booking lead time:</strong> ${act.booking}
                        </div>
                    ` : '';

                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
                            ${imageHtml}
                            <div class="p-6 flex-1 flex flex-col text-slate-700">
                                <h5 class="text-xl font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100">${act.title}</h5>
                                
                                <div class="text-[15px] leading-relaxed flex-1">
                                    ${act.description}
                                </div>
                                
                                ${detailsHtml}
                                ${bookingHtml}
                            </div>
                        </div>
                    `;
                });

                html += `
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function switchLocation(location) {
            if(currentLocation === location) return;
            currentLocation = location;
            
            const container = document.getElementById('app-container');
            container.style.opacity = '0.3';
            
            setTimeout(() => {
                renderApp();
                container.style.opacity = '1';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }

        function toggleCategory(id) {
            const element = document.getElementById(id);
            if (element.classList.contains('is-open')) {
                element.classList.remove('is-open');
            } else {
                element.classList.add('is-open');
            }
        }

        window.onload = () => {
            renderApp();
        };
    </script>
